name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

      - name: Build React App
        run: |
          cd app
          npm run build
        env:
          # If you set up your own backend API and GitHub App, you can configure these:
          # REACT_APP_API_BASE_URL: 'https://your-backend-api-url.com'
          # REACT_APP_GITHUB_APP_NAME: 'your-github-app-name'
          REACT_APP_ENABLE_LOCAL: 'false'
          REACT_APP_ENABLE_GITHUB: 'true'
          CI: 'false'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: app/build
          branch: gh-pages
          clean: true
